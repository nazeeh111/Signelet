name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native STAM dependency
        run: python -m pip install --only-binary=:all: stam==0.12.1
      - name: Test source with native STAM
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_native.py -v
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Install and verify outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --only-binary=:all: dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py examples/repeated.stam.json "$RUNNER_TEMP/signelet-example"
