name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install real native STAM dependency
        run: |
          python -m pip install --only-binary=:all: stam==0.12.1
      - name: Test source with native STAM
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_native.py -v
      - name: Test offline review controls
        run: |
          node --version
          node --test tests/review-ui.test.mjs
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Install and verify outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install --only-binary=:all: dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/installed/bin/python" tests/installed_smoke.py examples/repeated.stam.json "$RUNNER_TEMP/signelet-example"
          "$RUNNER_TEMP/installed/bin/python" tests/installed_review_smoke.py examples/repeated.stam.json "$RUNNER_TEMP/signelet-review"
